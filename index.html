<!DOCTYPE html><html lang="zh-HK"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>城巴 23 到站時間</title>
<link href="https://fonts.googleapis.com/css2?family=Didact+Gothic&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#0A1628;--n7:#1a3259;--n6:#2c4a7c;--n5:#4164a5;--cyan:#06B6D4;--teal:#2DD4BF}
*{box-sizing:border-box}
body{margin:0;font-family:'Didact Gothic','Noto Sans TC',sans-serif;color:#fff;min-height:100vh;
background:linear-gradient(135deg,#0A1628 0%,#1a3259 50%,#2c4a7c 100%) fixed}
.wrap{max-width:896px;margin:0 auto;padding:48px 24px}
.badge{display:inline-block;font-size:12px;letter-spacing:.05em;padding:4px 10px;border-radius:999px;background:rgba(6,182,212,.15);color:var(--cyan);border:1px solid rgba(6,182,212,.3)}
h1{font-size:48px;font-weight:700;margin:12px 0 8px;background:linear-gradient(to bottom right,#06B6D4,#2DD4BF);-webkit-background-clip:text;color:transparent}
.sub{color:rgba(255,255,255,.65);margin:0 0 32px;line-height:1.6}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.card{background:#111c35;border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:24px}
.card h2{font-size:20px;font-weight:700;margin:0 0 4px}
.card .en{font-size:14px;color:rgba(255,255,255,.55);margin-bottom:16px}
.row{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-top:1px solid rgba(255,255,255,.1)}
.min{font-size:30px;font-weight:700;color:var(--teal)}.min small{font-size:14px;color:rgba(255,255,255,.6);margin-left:4px}
.time{font-size:14px;color:rgba(255,255,255,.7);font-variant-numeric:tabular-nums}
.rmk{font-size:12px;color:var(--cyan)}
.foot{margin-top:24px;font-size:12px;color:rgba(255,255,255,.5)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--teal);margin-right:6px;animation:p 2s infinite}
@keyframes p{50%{opacity:.3}}
</style></head><body><div class="wrap">
<span class="badge">城巴 CITYBUS · 23</span>
<h1>23 往 蒲飛路</h1>
<p class="sub">北角碼頭 → 蒲飛路 · North Point Ferry Pier → Pokfield Road</p>
<div class="grid">
 <div class="card"><h2>琴行街, 英皇道</h2><div class="en">Kam Hong Street, King's Road</div><div id="s001279">載入中…</div></div>
 <div class="card"><h2>孫中山紀念館, 堅道</h2><div class="en">Dr Sun Yat-sen Museum, Caine Road</div><div id="s001019">載入中…</div></div>
</div>
<div class="foot"><span class="dot"></span><span id="upd">每 30 秒自動更新</span> · 資料來源：城巴 / DATA.GOV.HK</div>
</div>
<script>
const STOPS=["001279","001019"],data={};
async function load(){await Promise.all(STOPS.map(async s=>{try{const j=await(await fetch(`https://rt.data.gov.hk/v2/transport/citybus/eta/CTB/${s}/23`)).json();data[s]=j.data.filter(d=>d.dir==="O"&&d.eta)}catch(e){data[s]=null}}));
document.getElementById('upd').textContent="最後更新 "+new Date().toLocaleTimeString('zh-HK',{hour12:false})+" · 每 30 秒自動更新";render()}
function render(){const now=Date.now();STOPS.forEach(s=>{const el=document.getElementById('s'+s),a=data[s];
if(a===undefined)return;if(a===null){el.textContent="未能取得資料";return}if(!a.length){el.textContent="暫時沒有班次資料";return}
el.innerHTML=a.map(d=>{const t=new Date(d.eta),m=Math.max(0,Math.round((t-now)/60000));
return`<div class="row"><div><div class="min">${m===0?"即將到達":m+"<small>分鐘</small>"}</div>${d.rmk_tc?`<div class="rmk">${d.rmk_tc}</div>`:""}</div><div class="time">${t.toLocaleTimeString('zh-HK',{hour:'2-digit',minute:'2-digit',hour12:false})}</div></div>`}).join("")})}
load();setInterval(load,30000);setInterval(render,10000);
</script></body></html>
